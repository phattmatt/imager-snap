name: rpi-imager
version: "1.9.6"
base: core24
adopt-info: imagewriter
summary: Raspberry Pi Imager
website: https://www.raspberrypi.com/software/
source-code: https://github.com/raspberrypi/rpi-imager
issues: https://github.com/waveform80/imager-snap
icon: images/rpi-imager.png
license: Apache-2.0
description: |
  Raspberry Pi Imager is an easy to use application for installing Raspberry Pi
  OS, or other operating systems, to an SD card ready to use with your
  Raspberry Pi.

  Usage is as simple as:

  1. Pick the Raspberry Pi board you want to use.

  2. Pick the operating system you want to write.

  3. Pick the storage you want to write it to (SD card, hard drive, SSD, etc.)

  4. Click "NEXT", confirm you wish to overwrite your storage and wait!

  The application also verifies that the operating system has been written
  correctly after writing has finished. With certain operating system images,
  the imager also supports customizing the first boot configuration (you will
  be prompted for more information after selecting "NEXT" in this case).
compression: lzo
grade: stable
confinement: strict
platforms:
  amd64: null
  arm64: null
  armhf: null
  # This isn't going to work until the gnome content snap supports it
  #riscv64: {}
  # Can't build ppc64el anymore as gnome content snap stopped supporting it
  # in Core 24
  #ppc64el: {}
  # Can't build s390x as upstream is little-endian specific
  #s390x: {}

apps:
  rpi-imager:
    command: usr/bin/rpi-imager
    #command-chain:
    #  - bin/desktop-launch
    desktop: usr/share/applications/org.raspberrypi.rpi-imager.desktop
    environment:
      DISABLE_WAYLAND: 1
      # From https://github.com/ubuntu/snapcraft-desktop-helpers/pull/227#issuecomment-2694314156.
      LD_LIBRARY_PATH: $LD_LIBRARY_PATH:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libproxy
    extensions: [gnome]
    plugs:
      - x11
      - opengl
      - network
      - desktop
      - desktop-legacy
      - home
      - removable-media  # required to re-write first-boot configuration
      - mount-observe    # required to report mounts on target media
      - network-manager  # required to grab image
      - network-control
      - cifs-mount
      - udisks2          # required for writing to sd card
      - hardware-observe # required to find card with lsblk
      - wayland          # required for theming on wayland
      - gsettings        # required for theming on wayland

# From https://github.com/ubuntu/snapcraft-desktop-helpers/pull/227#issuecomment-2694314156
layout:
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libproxy:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libproxy

parts:
  qt:
    plugin: nil
    source: https://github.com/raspberrypi/rpi-imager.git
    source-type: git
    source-tag: v1.9.6
    source-subdir: qt
    build-packages:
      - build-essential
      - perl
      - python3
      - git
      - cmake
      - ninja-build
      - pkg-config
      - wget
      # Qt6 build deps
      - bison
      - flex
      - gperf
      - libx11-dev
      - libx11-xcb-dev
      - libxext-dev
      - libxfixes-dev
      - libxi-dev
      - libxrender-dev
      - libxcomposite-dev
      - libxcursor-dev
      - libxdamage-dev
      - libxrandr-dev
      - libxtst-dev
      - libxcb1-dev
      - libxcb-cursor-dev
      - libxcb-glx0-dev
      - libxcb-icccm4-dev
      - libxcb-image0-dev
      - libxcb-keysyms1-dev
      - libxcb-randr0-dev
      - libxcb-render-util0-dev
      - libxcb-shape0-dev
      - libxcb-shm0-dev
      - libxcb-sync-dev
      - libxcb-util-dev
      - libxcb-xfixes0-dev
      - libxcb-xinerama0-dev
      - libxcb-xkb-dev
      - libinput-dev
      - libxkbcommon-dev
      - libxkbcommon-x11-dev
      - libfontconfig1-dev
      - libfreetype-dev
      - libicu-dev
      - libdrm-dev
      - libegl1-mesa-dev
      - libgbm-dev
      - libgles2-mesa-dev
      - libvulkan-dev
      - libjpeg-dev
      - libpng-dev
      - zlib1g-dev
      - libasound2-dev
      - libpulse-dev
      - libnss3-dev
      - libssl-dev
      - libdbus-1-dev
      - libglib2.0-dev
      - libsqlite3-dev
      - libdouble-conversion-dev
      - libpcre2-dev
      - libatk1.0-dev
      - libatk-bridge2.0-dev
      - libcups2-dev
      - libassimp-dev
      # Wayland deps
      - libwayland-dev
      - wayland-protocols
      - libxkbcommon-dev
      - libwayland-cursor0
      - libwayland-egl1
      - libwayland-server0
      - libwayland-client0
      - libwayland-bin
    stage-packages:
      - libxcb-cursor0
    override-build: |
      cd "$CRAFT_PART_SRC"
      patch -p1 < "$CRAFT_PROJECT_DIR"/no-arch-suffix.patch
      ./build-qt.sh \
        --unprivileged \
        --prefix="$CRAFT_PART_INSTALL"/usr
  imagewriter:
    after: [qt]
    plugin: cmake
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=MinSizeRel
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DENABLE_CHECK_VERSION=OFF
      - -DQt6_ROOT="$CRAFT_STAGE"/usr
    source: https://github.com/raspberrypi/rpi-imager.git
    source-type: git
    source-tag: v1.9.6
    source-subdir: src
    stage-packages:
      - util-linux
      - dosfstools
      - fdisk
      - libassimp5
      - libdraco8
      - libpugixml1v5
    build-packages:
      - cmake
      - pkg-config
      - devscripts
      - libgnutls28-dev
